# _data/software.yml
# Public-renderable records for software, databases, CLI tools, and web applications.
# Covers R packages, Python packages, standalone macOS/Linux binaries,
# web applications, and database interfaces.
# Operational notes (release history, known issues, download counts) live in _private/software_log.yml
# Narrative and STAR content lives in _data/evidence_statements.yml keyed by id.
#
# STATUS VOCABULARY
#   dev | released | cran | pypi | deprecated
#
# TYPE VOCABULARY
#   r_package | python_package | binary | web_app | database | cli | api
#
# PLATFORM VOCABULARY (list, use all that apply)
#   r | python | bash | rust | c | macos | linux | windows | web | cli
#
# TAG VOCABULARY: same as publications.yml

