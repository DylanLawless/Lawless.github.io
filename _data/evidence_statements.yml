- id: topic_archipelago
  entry_ids: [lawless_2026_archipelago, archipelago_r]
  label: "Archipelago — variant set association visualisation method"
  competency: [digital_innovation, scientific_excellence]
  star: >
    Situation: Variant set association test (VSAT) statistics lacked genomic coordinates,
    making visual comparison with single-variant GWAS results impossible.
    Task: Design a method assigning meaningful genomic positions to VSAT p-values and
    integrating both scales into a single navigable plot.
    Action: Developed the Archipelago method. Validated across three independent datasets:
    1000 Genomes, Pan-UK Biobank (490,640 participants), and UK Biobank WGS. Released
    as an R package on CRAN with full customisation.
    Result: First author. Published Genetic Epidemiology (Wiley, 2026). Applied in SPSS
    and SwissPedHealth analyses. CRAN DOI 10.32614/CRAN.package.archipelago.
  metric: "First author. Wiley Genetic Epidemiology 2026. Validated in 490,640 UK Biobank participants. CRAN."
  tags: [statistical_genetics, software_product, reproducibility]
  weight: 3

- id: topic_variant_impact
  entry_ids: [variantimpact_vercel]
  label: "Variant Impact — fullstack molecular informatics platform"
  competency: [digital_innovation, delivery]
  star: >
    Situation: Protein variant interpretation required integration of gnomAD, UniProt,
    ClinVar, AlphaFold, and RCSB PDB — no single platform combined all with an
    interactive 3D structure viewer and variant landscape visualisation.
    Task: Build a fullstack web application demonstrating end-to-end molecular informatics.
    Action: Built with Next.js, React, TypeScript, and Tailwind. Integrated Molstar 3D
    protein structure viewer, variant landscape heatmaps, protein feature tracks, gnomAD
    constraint scores, ClinVar classifications, AlphaFold confidence scores, and RCSB
    structure data. Deployed on Vercel.
    Result: Deployed at variantimpact.vercel.app. Demonstrates the complete fullstack
    molecular informatics stack: molecular databases, interactive 3D visualisation,
    and variant landscape analysis in a single application.
  metric: "Live deployed product. Molstar 3D. gnomAD + UniProt + ClinVar + AlphaFold + RCSB PDB integrated."
  tags: [software_product, clinical_genomics, ai_systems, product_strategy]
  weight: 2

