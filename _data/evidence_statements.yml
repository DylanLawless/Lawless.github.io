# ── LEADERSHIP ─────────────────────────────────────────────────────────────────

- id: topic_switzerland_omics_product
  entry_ids: [switzerlandomics_ch, quantbayes_com]
  label: "Switzerland Omics — scientific product ecosystem"
  competency: [leadership, digital_innovation]
  star: >
    Situation: Probabilistic genomics methods existed in research code but lacked the
    product architecture, documentation, regulatory positioning, and brand credibility
    needed for institutional or commercial adoption.
    Task: Build a complete scientific product environment from naming and IP through
    to deployed products and commercial revenue.
    Action: Established Switzerland Omics, registered the trademark (Swissreg, Nice
    classes 9 and 42, valid to 2035), designed the product taxonomy, built and shipped
    multiple products including QuantBayes Studio, PanelAppRex, Genomic Vault, and
    Variant Impact, and structured the commercial spin-off.
    Result: Registered trademark. Multiple live products. Commercial revenue stream
    via QuantBayes Studio. AWS research funding secured 2026.
  metric: "Registered trademark 2035. Multiple live products. Commercial revenue. AWS funding 2026."
  tags: [product_strategy, scientific_leadership, software_product, bayesian_inference]
  weight: 3
