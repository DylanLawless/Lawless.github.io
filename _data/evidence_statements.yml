- id: topic_sga_standards
  entry_ids: [qem_standard, errs_standard, sga_founder_president]
  label: "Swiss Genomics Association — founded neutral standards body"
  competency: [leadership, stakeholder_influence]
  star: >
    Situation: No institution-neutral standard existed for expressing genomic evidence
    matrices or reporting statistical evidence ratios across heterogeneous study designs
    and institutions.
    Task: Found an independent scientific association capable of issuing and maintaining
    normative standards for the Swiss and international genomics community.
    Action: Established the Swiss Genomics Association (2024). Issued the Qualifying
    Evidence Matrix (QEM, Zenodo DOI 10.5281/zenodo.17936587) and the Evidence Ratio
    Reporting Standard (ERRS, Zenodo DOI 10.5281/zenodo.18261075). Registered both as
    versioned standards with permanent DOIs. Built a member network spanning Swiss
    academic, clinical, and industry bioinformatics.
    Result: Two normative published standards cited in peer-reviewed work. 35+ members
    across Swiss institutions. ERRS implemented in the CRAN evidenceratio package.
  metric: "2 published standards. Zenodo DOIs. 35+ members. Cited in publications. CRAN implementation."
  tags: [scientific_leadership, open_standard, cross_institutional]
  weight: 3

