- id: topic_spss_gwas
  entry_ids: [lawless_2025_spss_gwas, grant_snf_201060_spss]
  label: "Paediatric sepsis GWAS — first reproducible susceptibility locus"
  competency: [scientific_excellence, delivery]
  star: >
    Situation: Sepsis is the leading infectious cause of childhood death; no reproducible
    genome-wide susceptibility locus had been identified in a paediatric cohort.
    Task: Lead the statistical genetics analysis within a national multi-centre programme
    (CHF 930K, three Swiss children's hospitals).
    Action: Designed and executed a GWAS in 650 blood-culture-confirmed paediatric sepsis
    cases and 1,395 controls; applied case-control and case-only designs; coordinated
    genotype data governance across institutions; built analysis pipelines from QC through
    to fine-mapping.
    Result: Identified the first reproducible paediatric sepsis susceptibility signal at
    the CTNNAL1/ELP1 locus. First author. Accepted Lancet eBioMedicine 2025.
    GWAS summary statistics deposited in EBI GWAS Catalogue (GCST90726424).
  metric: "First author. Lancet eBioMedicine accepted 2025. 650 cases / 1,395 controls. CHF 930K programme. GWAS Catalogue GCST90726424."
  tags: [statistical_genetics, clinical_genomics, paediatrics, cross_institutional]
  weight: 3

- id: topic_spss_wes
  entry_ids: [lawless_2025_spss_wes, grant_snf_201060_spss]
  label: "Paediatric sepsis rare variant pathways — 66 IEI candidates"
  competency: [scientific_excellence, delivery]
  star: >
    Situation: Common variants explain little sepsis heritability; rare immune pathway
    variants had not been systematically tested in a paediatric clinical cohort.
    Task: Design and execute multi-tiered rare variant analyses — single-case, single-variant,
    gene-level, and protein pathway — across 940 children with confirmed sepsis.
    Action: Built automated interpretation pipelines covering SKAT-O, burden testing, and
    protein pathway clustering. Applied novel pathway grouping to identify enriched
    immune pathway hits.
    Result: Identified 66 candidate inborn error of immunity cases and two immune pathway
    hits spanning 50 genes. Findings inform treatment decisions at the Molecular Board.
    First author. Under review.
  metric: "First author. Under review. 66 IEI candidates. Two pathway hits (50 genes). 940 children."
  tags: [statistical_genetics, rare_disease, clinical_genomics, paediatrics]
  weight: 3

- id: topic_tet2_discovery
  entry_ids: [stremenova_2020_tet2]
  label: "Germline TET2 deficiency — new disease entity in Blood"
  competency: [scientific_excellence]
  star: >
    Situation: A cluster of children with immunodeficiency and lymphoma had no genetic
    diagnosis despite extensive workup across multiple centres.
    Task: Lead genomic interpretation and support functional validation to identify the
    mechanism in an international collaborative study.
    Action: Identified germline TET2 loss-of-function as the causal mechanism; supported
    functional validation including B-cell differentiation assays, flow cytometry, and
    immunofluorescence; coordinated IUIS disease classification submission.
    Result: Germline TET2 deficiency established as a new disease entity. Published Blood
    (2020, IF ~20). Added to the IUIS inborn errors of immunity classification.
    Treatment implications confirmed (rituximab). Joint lead author on 30-centre study.
  metric: "Joint lead author. Blood 2020 (IF ~20). New IUIS disease. Treatment decision confirmed."
  tags: [rare_disease, clinical_genomics, scientific_leadership]
  weight: 3

- id: topic_qv_framework
  entry_ids: [lawless_2026_qv, qv_database]
  label: "Qualifying variant framework — published open standard"
  competency: [scientific_excellence, digital_innovation]
  star: >
    Situation: Variant selection criteria were embedded in pipeline code, making them
    invisible to reviewers, impossible to audit, and unable to be reused across studies.
    Task: Propose and publish a unified framework for expressing variant criteria as
    standalone, versioned, pipeline-independent specifications.
    Action: Designed the QV framework with YAML/JSON criteria, a reference model covering
    16 variant states, and three validation studies (rare disease WES cohort of 940
    individuals, HapMap3 GWAS, GIAB WGS trio) each achieving bitwise-identical outputs
    to conventional hard-coded methods. Released as a public database and peer-reviewed paper.
    Result: First author. Published OUP Bioinformatics (2026). CRAN-released. Adopted in
    the SwissPedHealth clinical pipeline serving approximately 1,000 children.
    NHS Genomic Test Directory panels integrated.
  metric: "First author. OUP Bioinformatics 2026. CRAN. Live clinical pipeline. Three validation studies."
  tags: [open_standard, reproducibility, clinical_genomics, regulated_delivery]
  weight: 3

- id: topic_quantbayes
  entry_ids: [quant_group_2025_quantbayes, quantbayes_r, quantbayes_binary]
  label: "QuantBayes — Bayesian evidence sufficiency for variant interpretation"
  competency: [scientific_excellence, digital_innovation]
  star: >
    Situation: Genomic variant evidence is expressed heterogeneously across pipelines and
    institutions; no quantitative standard existed for measuring evidence sufficiency with
    calibrated uncertainty.
    Task: Build a closed-form Bayesian model producing posterior evidence sufficiency
    estimates with credible intervals from binary evidence matrices.
    Action: Designed a Beta-Binomial model, implemented as a deterministic C algorithm
    (no simulation required), released as standalone macOS/Linux binaries and as an R
    package on CRAN, validated on the GIAB trio WGS dataset, and preprinted with full
    methodology. A user survey (DESAT ethics approved) confirmed improved clinician
    understanding with explicit evidence reporting.
    Result: Senior/corresponding author. CRAN-released December 2025. Over 3,000
    combined downloads per quarter. Implementation at quantbayes.com.
  metric: "Senior author. CRAN Dec 2025. 3,000+ downloads/quarter. Commercial product."
  tags: [bayesian_inference, clinical_genomics, software_product, regulated_delivery]
  weight: 3

- id: topic_iei_genetics_database
  entry_ids: [quant_group_2025_var_risk_est]
  label: "IEI prior probability database — 54,814 ClinVar classifications"
  competency: [scientific_excellence, digital_innovation]
  star: >
    Situation: Clinical variant interpretation in inborn errors of immunity lacked a
    quantitative prior probability baseline, forcing reliance on qualitative expert
    judgement without uncertainty estimates.
    Task: Build a systematic prior probability database covering the full IEI gene
    landscape from population-scale ClinVar data.
    Action: Processed 54,814 ClinVar variant classifications across 557 IEI genes.
    Derived gene-level and variant-level prior probabilities under both autosomal dominant
    and autosomal recessive inheritance models. Validated against NFKB1 (AD) and CFTR
    (AR) clinical cohorts.
    Result: Senior author. Under review npj Genomic Medicine. Database publicly released
    at iei-genetics.github.io.
  metric: "Senior author. Under review npj Genomic Medicine. 54,814 ClinVar entries. 557 IEI genes. Validated AD+AR."
  tags: [bayesian_inference, rare_disease, clinical_genomics, statistical_genetics]
  weight: 3

- id: topic_rag1_rag2_priors
  entry_ids: [lawless_2019_rag1_rag2]
  label: "RAG1/RAG2 variant occurrence — probabilistic precursor to QuantBayes"
  competency: [scientific_excellence]
  star: >
    Situation: RAG1 and RAG2 deficiency spans a spectrum of rare immune disease; no
    quantitative basis existed for predicting which variants would be observed clinically
    versus in the general population.
    Task: Develop a probabilistic framework for predicting variant occurrence across RAG1
    and RAG2 using population genetics and functional annotation.
    Action: Integrated gnomAD population allele frequencies, Hardy-Weinberg priors,
    inheritance models, and structural/functional annotation. Applied to approximately
    500 severe clinical cases from the NIHR BioResource rare disease cohort.
    Result: First author. Published Journal of Clinical Immunology (2019). Established
    the quantitative variant occurrence methodology that became the conceptual precursor
    to the QuantBayes framework.
  metric: "First author. JCI 2019. ~500 NIHR BioResource cases. Precursor to QuantBayes."
  tags: [rare_disease, clinical_genomics, bayesian_inference, statistical_genetics]
  weight: 2

- id: topic_rare_disease_leeds
  entry_ids: [stremenova_2020_tet2, lawless_2019_rag1_rag2, lawless_2018_rag_deficiency, lawless_2018_tnfaip3_stills, masters_2016_pyrin, wu_2021_cracr2a]
  label: "Leeds rare immune disease programme — 10+ disease discoveries"
  competency: [scientific_excellence, delivery]
  star: >
    Situation: Approximately 500 patients with severe immune-mediated disease at St James's
    University Hospital lacked a genetic diagnosis, preventing targeted treatment.
    Task: Contribute genomic discovery and functional validation across multiple disease
    programmes within the NIHR BioResource rare disease cohort.
    Action: Led or co-led discovery of germline TET2 deficiency (Blood 2020, IUIS-classified),
    RAG deficiency in adults (JACI 2018), RAG1/2 variant occurrence modelling (JCI 2019),
    CRACR2A deficiency (eLife 2021), TNFAIP3 autoinflammation (Frontiers Immunol 2018),
    CFTR as a modifying cofactor in PID (JACI 2023), and pyrin pathway autoinflammation
    (Science Translational Medicine 2016). Applied WES/WGS, flow cytometry, B-cell
    differentiation, iPSC haematopoietic systems, and functional assays.
    Result: More than 10 peer-reviewed disease discovery and precision treatment findings.
    Treatments confirmed including rituximab, anakinra, and tocilizumab.
  metric: "10+ disease publications. Blood, eLife, JACI, Sci Transl Med, JCI, Frontiers. Treatments confirmed."
  tags: [rare_disease, clinical_genomics, scientific_leadership, regulated_delivery]
  weight: 3

- id: topic_rsv_viral_genomics
  entry_ids: [lawless_2022_rsv_prolonged]
  label: "RSV viral genomics — birth cohort determinants of prolonged infection"
  competency: [scientific_excellence]
  star: >
    Situation: The viral genetic determinants of prolonged RSV infection in infants were
    unknown, limiting understanding of why some children suffer more severe and extended illness.
    Task: Identify viral genetic factors associated with prolonged RSV infection in a
    healthy term birth cohort.
    Action: Analysed RSV genome sequences from 300+ infants in the Vanderbilt birth cohort.
    Applied viral genome-wide association methods and gene-level tests to identify viral
    loci associated with infection duration.
    Result: First author. Published Journal of Infectious Diseases (2022). Identified
    specific RSV genomic loci associated with prolonged infection, providing targets for
    intervention strategy.
  metric: "First author. Journal of Infectious Diseases 2022. 300+ infants. Vanderbilt birth cohort."
  tags: [statistical_genetics, clinical_genomics]
  weight: 2

