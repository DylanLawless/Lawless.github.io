- id: topic_genomic_vault
  entry_ids: [genomicvault_ch]
  label: "Genomic Vault — custodianship platform"
  competency: [delivery, digital_innovation]
  star: >
    Situation: No neutral, governance-ready platform existed for long-term genomic data
    custody with auditable access control and payment infrastructure.
    Task: Build a working custodianship and governance platform deployable as a
    commercial and institutional service.
    Action: Built fullstack application with encrypted storage, Drizzle ORM, Supabase
    row-level security, Stripe payment webhooks, immutable audit logs, and
    SPHN-compliant RDF metadata. Deployed with operational access controls.
    Result: Live at genomicvault.switzerlandomics.ch with working payments and access
    governance.
  metric: "Live deployed product. Stripe, Supabase RLS, immutable audit trail."
  tags: [data_infrastructure, regulated_delivery, product_strategy]
