- id: topic_panelapprex
  entry_ids: [quant_group_2026_panelapprex, panelapprex_app]
  label: "PanelAppRex — disease-gene panel aggregation and AI search"
  competency: [digital_innovation, scientific_excellence]
  star: >
    Situation: Disease-gene panel data was fragmented across sources, inconsistently
    annotated, and inaccessible for programmatic use in diagnostic pipelines.
    Task: Build a system aggregating, harmonising, and making queryable the full
    landscape of curated disease-gene panel evidence.
    Action: Aggregated 58,592 gene-disease associations from Genomics England PanelApp,
    ClinVar, UniProt, and Ensembl. Applied RAG on the UniProtKB human proteome to compress
    6.6 million features fivefold into structured disease-aware panel summaries. Built a
    natural-language search interface and machine-readable export formats. Benchmarked
    across 15 published case studies spanning immunology, neurology, and mixed disease areas.
    Result: Senior/corresponding author. Published Bioinformatics Advances (OUP, 2026).
    93–100% benchmark accuracy. Public dataset on Zenodo. Integrated in SwissPedHealth
    clinical workflows.
  metric: "Senior author. OUP Bioinformatics Advances 2026. 58,592 entries. 93-100% benchmark. 6.6M→135K features."
  tags: [ai_systems, clinical_genomics, rare_disease, software_product]
  weight: 3

