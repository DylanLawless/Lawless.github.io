# _data/websites.yml
# Public-renderable records for websites, platforms, and web properties
# that you built, founded, or maintain.
# Distinct from software.yml (code tools) — these are operational web presences.
# Narrative and STAR content lives in _data/evidence_statements.yml keyed by id.
#
# STATUS VOCABULARY
#   active | archived | redirected
#
# TYPE VOCABULARY
#   product_site | research_platform | association_site | personal_site | data_portal
#
# MY_ROLE VOCABULARY
#   manage | founder_and_builder | builder | maintainer | contributor
#
# TAG VOCABULARY: same as publications.yml

