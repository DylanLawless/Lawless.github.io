# _data/service.yml
# Public-renderable records for scientific service, leadership, and administrative roles.
# Covers: association founder/officer, editorial boards, committee membership,
# review panels, advisory roles, programme committees.
# Distinct from grants.yml (funded employment) and employment (academic positions).
# Narrative and STAR content lives in _data/evidence_statements.yml keyed by id.
#
# STATUS VOCABULARY
#   active | completed | emeritus
#
# TYPE VOCABULARY
#   leadership | association |  editorial_board | reviewer
#   committee_member | advisory_board | programme_committee | working_group
#   guest_lecturer | teaching_assistant
#
# MY_ROLE VOCABULARY
#   founder_and_president | president | vice_president | secretary | treasurer
#   board_member | editor | associate_editor | reviewer | chair | member
#   guest_lecturer
#
# TAG VOCABULARY: same as publications.yml

